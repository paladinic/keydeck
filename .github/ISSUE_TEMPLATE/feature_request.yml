name: Feature request
description: Suggest something keydeck should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before you write: keydeck is deliberately one self-contained HTML file
        with no dependencies and no build step. Ideas that need a server, a
        library, or a second file won't fit, however good they are.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like keydeck to do?
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit?
      options:
        - label: This can work without any external dependency or network access
        - label: This keeps keydeck a single file
